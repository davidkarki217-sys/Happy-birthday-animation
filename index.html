<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Balloons -->
    <div class="balloons">
        <div class="balloon b1"></div>
        <div class="balloon b2"></div>
        <div class="balloon b3"></div>
        <div class="balloon b4"></div>
        <div class="balloon b5"></div>
        <div class="balloon b6"></div>
        <div class="balloon b7"></div>
        <div class="balloon b8"></div>
    </div>

    <!-- Main -->
    <div class="container">

        <h1>Happy Birthday <br> 
             SHREEYA 🎂🎉❤️
        </h1>

        <!-- Cake -->
        <div class="cake">

            <div class="plate"></div>

            <div class="cake-layer bottom">
                <div class="cream"></div>
            </div>

            <div class="cake-layer middle">
                <div class="cream"></div>
            </div>

            <div class="cake-layer top">
                <div class="cream"></div>
            </div>

            <!-- Candle -->
            <div class="candle">
                <div class="flame"></div>
            </div>

        </div>

        <p> Many many happy return of the day! 🎂</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
